<html>
<head>
<link rel="stylesheet" href='calc.css'></link>
<title>Calculator</title>
<body>
<script>
	var currentnum=0;
	var operator='';
	var storednum=0;

	function handleOperator(op){
		if(operator==''){
			storednum=currentnum;
			currentnum=0;
		}
		else if(operator=='+'){
			storednum+=currentnum;
			currentnum=0;
			document.getElementById('bt').innerHTML=storednum;

		} 
		else if(operator=='-'){
			storednum-=currentnum;
			currentnum=0;
			document.getElementById('bt').innerHTML=storednum;
		} 
		else if(operator=='x'){
			storednum*=currentnum;
			currentnum=0;
			document.getElementById('bt').innerHTML=storednum;

		} 
		else if(operator=='÷'){
			storednum/=currentnum;
			currentnum=0;
			document.getElementById('bt').innerHTML=storednum;
		} 
		else if(operator=='='){
			document.getElementById('bt').innerHTML=storednum;
		}

		currentnum=0; 
		operator=op; 

		}
</script>
<div id=calc1>
<div id='ops'><span id=opst></span></div>
<div id='b0' onclick="currentnum=currentnum*10+0;document.getElementById('bt').innerHTML=currentnum;"><span id=b0text>0</span></div>
<div id='b1' onclick="currentnum=currentnum*10+1;document.getElementById('bt').innerHTML=currentnum;"><span id=b1text>1</span></div>
<div id='b2' onclick="currentnum=currentnum*10+2;document.getElementById('bt').innerHTML=currentnum;"><span id=b2text>2</span></div>

<div id='b7' onclick="currentnum=currentnum*10+7;document.getElementById('bt').innerHTML=currentnum;"><span id=b7text>7</span></div>
<div id='b8' onclick="currentnum=currentnum*10+8;document.getElementById('bt').innerHTML=currentnum;"><span id=b8text>8</span></div>
<div id='b9' onclick="currentnum=currentnum*10+9;document.getElementById('bt').innerHTML=currentnum;"><span id=b9text>9</span></div>

<div id='bdiv' onclick="handleOperator('÷');"><span id=bdivtext>÷</span></div>
<div id='bce' onclick="currentnum=Math.floor(currentnum/10);document.getElementById('bt').innerHTML=currentnum;"><span id=bcetext>CE</span></div>
<div id='bac' onclick="currentnum=0;storednum=0;document.getElementById('bt').innerHTML=currentnum;"><span id=bactext>AC</span></div>
